name: Feature request
description: Propose a focused improvement within the documented trust boundary
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or developer problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe behavior, not implementation detail.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Privacy and document-boundary impact
      description: Explain what Word content would be read, sent, stored, or changed.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: I reviewed the current compatibility and limitations.
          required: true
        - label: The proposal does not include real client data or credentials.
          required: true
